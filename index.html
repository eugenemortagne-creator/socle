<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="apple-mobile-web-app-title" content="Socle">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<title>Socle</title>
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1C1C1E" media="(prefers-color-scheme: dark)">
<style>
/* Layout : app bancaire mobile — en-tête, carte héros, sections en cartes et listes groupées, barre flottante avec + central */
:root{
  --bg:#F2F2F7; --glow:transparent; --surface:#FFFFFF; --surface-2:#F2F2F7; --surface-3:#E5E5EA; --ink:#0B0B0F; --muted:#8A8A8E; --line:#E5E5EA;
  --accent:#3B5BFD; --accent-ink:#FFFFFF; --accent-soft:#E8ECFF; --gold:#E08A00; --seg-on:#FFFFFF;
  --hero-a:#0E0E12; --hero-b:#18181D; --hero-c:#26262E; --hero-ink:#FFFFFF; --hero-muted:#9A9AA3; --hero-line:rgba(255,255,255,.1);
  --good:#1F9D55; --warn:#D97F00; --bad:#E5484D; --info:#3B5BFD;
  --k1:#34C759; --k2:#FF9F0A; --k3:#0A84FF; --k4:#FF375F; --k5:#30B0C7; --k6:#FF6B35; --k7:#8E5CF7;
  --shadow:none; --card:#FFFFFF; --card-hi:none; --key:#F2F2F7;
  --f-display:-apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", system-ui, "Segoe UI", Roboto, sans-serif; --f-body:-apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", system-ui, "Segoe UI", Roboto, sans-serif;
  --r:18px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#000000; --glow:transparent; --surface:#1C1C1E; --surface-2:#2C2C2E; --surface-3:#3A3A3C; --ink:#FFFFFF; --muted:#8E8E93; --line:#2C2C2E;
  --accent:#6B83FF; --accent-ink:#FFFFFF; --accent-soft:#1F2752; --gold:#FF9F0A; --seg-on:#48484A;
  --hero-a:#151518; --hero-b:#1E1E22; --hero-c:#2C2C33; --hero-ink:#FFFFFF; --hero-muted:#98989F; --hero-line:rgba(255,255,255,.1);
  --good:#30D158; --warn:#FF9F0A; --bad:#FF453A; --info:#6B83FF;
  --k1:#30D158; --k2:#FF9F0A; --k3:#0A84FF; --k4:#FF375F; --k5:#40C8E0; --k6:#FF6B35; --k7:#9D7BFF;
  --shadow:none; --card:#1C1C1E; --card-hi:none; --key:#2C2C2E;
  color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#000000; --glow:transparent; --surface:#1C1C1E; --surface-2:#2C2C2E; --surface-3:#3A3A3C; --ink:#FFFFFF; --muted:#8E8E93; --line:#2C2C2E;
  --accent:#6B83FF; --accent-ink:#FFFFFF; --accent-soft:#1F2752; --gold:#FF9F0A; --seg-on:#48484A;
  --hero-a:#151518; --hero-b:#1E1E22; --hero-c:#2C2C33; --hero-ink:#FFFFFF; --hero-muted:#98989F; --hero-line:rgba(255,255,255,.1);
  --good:#30D158; --warn:#FF9F0A; --bad:#FF453A; --info:#6B83FF;
  --k1:#30D158; --k2:#FF9F0A; --k3:#0A84FF; --k4:#FF375F; --k5:#40C8E0; --k6:#FF6B35; --k7:#9D7BFF;
  --shadow:none; --card:#1C1C1E; --card-hi:none; --key:#2C2C2E;
  color-scheme:dark;}

*{box-sizing:border-box}
body{background:radial-gradient(700px 360px at 50% -140px, var(--glow), transparent 70%) no-repeat, var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:8px calc(108px + env(safe-area-inset-bottom, 0px));}
.app{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:24px}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.015em}
h1{font-size:25px;font-weight:600}
h2{font-size:17px;font-weight:600}
h3{font-size:15px;font-weight:600}
p{margin:0}
.label{font-size:11px;text-transform:uppercase;letter-spacing:.09em;color:var(--muted);font-weight:600}
.muted{color:var(--muted)} .small{font-size:12.5px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:6px}
.top .hello{display:flex;flex-direction:column;gap:1px;min-width:0}
.top .hello span{font-size:13px;color:var(--muted)}
.top-r{display:flex;align-items:center;gap:10px}
.icon-btn{width:42px;height:42px;border-radius:14px;border:0;background:var(--surface);box-shadow:var(--shadow);display:grid;place-items:center;color:var(--ink);flex:none}
.icon-btn svg{width:20px;height:20px}
.icon-btn[aria-current=page]{background:var(--ink);color:var(--bg)}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.dot{width:6px;height:6px;border-radius:50%;background:var(--muted)} .dot.ok{background:var(--good)} .dot.wait{background:var(--warn)}

.example{background:var(--surface);box-shadow:var(--shadow);border-radius:16px;padding:12px 14px;display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.example p{font-size:13.5px;flex:1 1 200px;min-width:0}

.hero{--rx:0deg;--ry:0deg;--mx:70%;--my:0%;
  background:radial-gradient(110% 80% at 100% 0%, rgba(240,195,106,.24), transparent 55%), radial-gradient(90% 70% at 0% 100%, rgba(79,209,165,.28), transparent 60%), linear-gradient(150deg,var(--hero-a) 0%,var(--hero-b) 55%,var(--hero-c) 100%);
  color:var(--hero-ink);border-radius:28px;padding:20px 20px 16px;display:flex;flex-direction:column;gap:14px;position:relative;overflow:hidden;isolation:isolate;
  transform:perspective(900px) rotateX(var(--rx)) rotateY(var(--ry));transition:transform .5s cubic-bezier(.2,.8,.2,1);box-shadow:0 18px 40px -18px rgba(8,40,34,.65);touch-action:pan-y}
.hero.tilting{transition:transform .08s linear}
.hero::before{content:"";position:absolute;inset:0;z-index:-1;background:repeating-linear-gradient(115deg,transparent 0 22px,rgba(255,255,255,.028) 22px 23px)}
.hero::after{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(280px 200px at var(--mx) var(--my), rgba(255,255,255,.16), transparent 70%);transition:background .3s}
.hero .label{color:var(--hero-muted)}
.hero-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:5px 10px;border-radius:99px;background:rgba(255,255,255,.12);color:var(--hero-ink);white-space:nowrap}
.chip svg{width:14px;height:14px}
.big{font-family:var(--f-display);font-size:40px;font-weight:600;line-height:1;letter-spacing:-.035em}
.big small{font-size:21px;color:var(--hero-muted);font-weight:500;letter-spacing:-.01em}
.delta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--hero-muted)}
.up-badge{display:inline-flex;align-items:center;gap:3px;padding:3px 8px;border-radius:8px;background:rgba(255,255,255,.12);color:var(--hero-ink);font-weight:600;font-size:12.5px}
.hero-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;border-top:1px solid var(--hero-line);padding-top:12px}
.hero-row div{display:flex;flex-direction:column;gap:2px;min-width:0}
.hero-row b{font-family:var(--f-display);font-weight:600;font-size:15px;white-space:nowrap}
.hero-row span{font-size:11.5px;color:var(--hero-muted)}

.section{display:flex;flex-direction:column;gap:10px}
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:10px}
.link{background:none;border:0;padding:4px 0;color:var(--accent);font-weight:600;font-size:14px}
.panel{background:var(--surface);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px;min-width:0}
.list{background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.list.inset{box-shadow:none;border:1px solid var(--line)}
.row{display:flex;align-items:center;gap:12px;padding:12px 16px;width:100%;background:none;border:0;text-align:left;position:relative;min-height:62px}
.row + .row::before{content:"";position:absolute;top:0;left:66px;right:0;border-top:1px solid var(--line)}
.row .grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.row .t{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.end{display:flex;flex-direction:column;align-items:flex-end;gap:4px;flex:none;min-width:0}
.env-name{display:flex;align-items:baseline;justify-content:space-between;gap:10px;min-width:0}
.env-name .t{font-weight:500;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.env-name .amt{flex:none}
.env-sub{line-height:1.35}
.amt{font-family:var(--f-display);font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;letter-spacing:-.01em}
.pos{color:var(--good)} .neg{color:var(--bad)}
.ico{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none;background:color-mix(in srgb, var(--kc, var(--muted)) 14%, var(--surface));color:var(--kc, var(--ink))}
.ico svg{width:19px;height:19px}
.empty{padding:22px 16px;text-align:center;color:var(--muted);font-size:14px}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:3px 8px;border-radius:99px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill.good{color:var(--good)} .pill.warn{color:var(--warn)} .pill.bad{color:var(--bad)} .pill.info{color:var(--info)}
.pill.dot::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.bar{height:6px;border-radius:99px;background:var(--surface-3);overflow:hidden;position:relative}
.bar i{display:block;height:100%;border-radius:99px;background:var(--gc,var(--accent));transition:width .6s ease}
.bar em{position:absolute;top:0;bottom:0;width:2px;background:var(--ink);opacity:.35}
.meta{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}

.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat{background:var(--surface);box-shadow:var(--shadow);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:3px;min-width:0}
.stat.flat{background:var(--surface-2);box-shadow:none}
.stat b{font-family:var(--f-display);font-size:20px;font-weight:600;letter-spacing:-.02em}
.stat span{font-size:12.5px;color:var(--muted)}

.month{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.month .kv{display:flex;flex-direction:column;gap:8px;min-width:0}
.month .kv .label{display:block;margin-bottom:2px}
.month .kv b[data-k]{font-family:var(--f-display);font-size:28px;font-weight:600;letter-spacing:-.03em;line-height:1.1;display:block}
.gauge{width:108px;height:108px}
.next{display:flex;align-items:center;gap:10px;padding-top:12px;border-top:1px solid var(--line);font-size:13.5px}
.next .grow{min-width:0;flex:1}

.plan-bar{display:flex;height:14px;border-radius:99px;overflow:hidden;gap:2px;background:var(--surface-3)}
.plan-bar i{display:block;height:100%}
.plan-rows{display:flex;flex-direction:column}
.plan-rows .pr{display:flex;align-items:center;gap:10px;padding:9px 0;font-size:14px}
.plan-rows .pr + .pr{border-top:1px solid var(--line)}
.plan-rows .sw{width:10px;height:10px;border-radius:3px;flex:none}
.plan-rows .pr span:nth-child(2){flex:1;min-width:0}
.plan-rows .pr.total{font-weight:700}
.month-nav{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--surface);box-shadow:var(--shadow);border-radius:16px;padding:6px}
.month-nav button{width:38px;height:38px;border:0;border-radius:11px;background:var(--surface-2);display:grid;place-items:center}
.month-nav button svg{width:18px;height:18px}
.month-nav button:disabled{opacity:.35;cursor:default}
.month-nav b{font-family:var(--f-display);font-weight:600;text-transform:capitalize}
.day{width:38px;height:42px;border-radius:12px;background:var(--surface-2);display:flex;flex-direction:column;align-items:center;justify-content:center;flex:none;line-height:1}
.day b{font-family:var(--f-display);font-size:15px;font-weight:600}
.day span{font-size:9.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-top:2px}
.row.done .day{opacity:.55}
.row.done .t{color:var(--muted)}
.env-row{display:flex;flex-direction:column;gap:9px;padding:14px 16px;width:100%;background:none;border:0;text-align:left;position:relative}
.env-row + .env-row::before,.env-row + .row::before{content:"";position:absolute;top:0;left:16px;right:0;border-top:1px solid var(--line)}
.env-top{display:flex;align-items:center;gap:12px}
.env-top .grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.split{display:flex;flex-direction:column;gap:12px}
.split-row{display:flex;flex-direction:column;gap:6px}
.split-row .hd{display:flex;justify-content:space-between;font-size:14px;gap:8px;flex-wrap:wrap}
.track{position:relative;height:8px;border-radius:99px;background:var(--surface-3)}
.track i{position:absolute;inset:0 auto 0 0;border-radius:99px}
.track em{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--ink);opacity:.45;border-radius:2px}

.rail{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding:2px 2px 8px;margin:-2px -2px 0;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.vault-mini{flex:0 0 150px;scroll-snap-align:start;background:var(--surface);box-shadow:var(--shadow);border-radius:var(--r);padding:14px;border:0;text-align:left;display:flex;flex-direction:column;gap:10px}
.vault-mini .t{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.vault-mini.add{align-items:center;justify-content:center;color:var(--accent);font-weight:600;background:transparent;box-shadow:none;border:1.5px dashed var(--line)}
.vault-mini.add svg{width:22px;height:22px}
.ring{flex:none}
.vault{background:var(--surface);box-shadow:var(--shadow);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;text-align:left;width:100%;border:0}
.vault-top{display:flex;gap:14px;align-items:center}
.vault-top .grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}

.insight{display:flex;gap:12px;align-items:flex-start;padding:13px 16px;position:relative}
.insight + .insight::before{content:"";position:absolute;top:0;left:58px;right:0;border-top:1px solid var(--line)}
.insight p{font-size:14px;min-width:0}
.insight .ico{width:30px;height:30px;border-radius:9px}
.insight .ico svg{width:16px;height:16px}

.tiers{display:flex;flex-direction:column;gap:8px}
.tier-bar{position:relative;height:34px;border-radius:10px;overflow:hidden;display:flex;background:var(--surface-3)}
.tier-bar i{display:flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:700;color:var(--accent-ink);font-style:normal;white-space:nowrap;overflow:hidden;min-width:0}
.tier-mark{position:absolute;top:-3px;bottom:-3px;width:3px;border-radius:2px;background:var(--ink);box-shadow:0 0 0 2px var(--surface)}
.tier-scale{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}
.cmp{width:100%;border-collapse:collapse;font-size:13.5px}
.cmp th{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;text-align:right;padding:0 0 8px}
.cmp th:first-child,.cmp td:first-child{text-align:left}
.cmp td{padding:10px 0;border-top:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}
.cmp td:first-child{font-weight:500;padding-right:8px}
.cmp tr.me td{color:var(--accent);font-weight:600}
.scroll-x{overflow-x:auto}
.note{font-size:12.5px;color:var(--muted);display:flex;gap:8px;align-items:flex-start}
.note svg{width:15px;height:15px;flex:none;margin-top:2px}

.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field label,.field .lbl{font-size:13px;font-weight:600;color:var(--muted)}
input,select{font:inherit;color:var(--ink);background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:12px 13px;width:100%;min-width:0;font-size:16px}
input[type=date],input[type=month]{-webkit-appearance:none;appearance:none;display:block;min-height:48px;max-width:100%;text-align:left}
input[type=date]::-webkit-date-and-time-value,input[type=month]::-webkit-date-and-time-value{text-align:left}
.grid2>*{min-width:0}
[hidden]{display:none!important}
.alert-box{display:flex;gap:12px;padding:14px;border-radius:14px;border:1.5px solid var(--bad);background:color-mix(in srgb, var(--bad) 12%, transparent)}
.alert-box svg{width:22px;height:22px;color:var(--bad);flex:none;margin-top:2px}
.alert-box p{margin:4px 0 0}
.confirm{display:flex;gap:12px;align-items:flex-start;font-size:14.5px;line-height:1.4;padding:12px 14px;border-radius:14px;background:var(--surface-2)}
.confirm input{width:22px!important;height:22px;flex:none;margin:1px 0 0;padding:0;accent-color:var(--accent)}
.min-card{display:flex;flex-direction:column;gap:10px;text-align:left;width:100%}
.min-card .bar{margin:0}
input[type=range]{padding:0;background:none;border:0;accent-color:var(--accent);height:28px}
.amount-in{font-family:var(--f-display);font-size:34px;font-weight:600;text-align:center;border:0;background:none;padding:6px 0;letter-spacing:-.03em}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--surface-2);border-radius:12px;padding:3px;gap:3px;border:1px solid var(--line)}
.seg button{border:0;background:none;padding:9px 4px;border-radius:9px;font-weight:600;font-size:13.5px;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.chips button{border:1px solid var(--line);background:var(--surface-2);border-radius:14px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--ink);min-width:0}
.chips button > span:not(.ico){max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chips button small{font-size:11px;font-weight:500;color:var(--muted);margin-top:-4px;font-variant-numeric:tabular-nums}
.chips button small.neg{color:var(--bad)}
.chips button.newchip{border-style:dashed;background:transparent;color:var(--accent)}
#q_env{display:flex;flex-direction:column;gap:8px}
#q_env .chips{grid-template-columns:repeat(3,minmax(0,1fr))}
details.more > summary{list-style:none;display:flex;align-items:center;gap:8px;cursor:pointer;font-weight:600;font-size:14px;color:var(--accent);padding:8px 2px}
details.more > summary::-webkit-details-marker{display:none}
details.more > summary .chev{width:18px;height:18px;margin-left:auto;flex:none;color:var(--muted);transition:transform .25s}
details.more[open] > summary .chev{transform:rotate(180deg)}
details.more[open] > .chips,details.more[open] > .rows{animation:rise .3s cubic-bezier(.2,.8,.2,1)}
details.more > .chips{padding-top:4px}
.list details.more{border-top:1px solid var(--line)}
.list details.more > summary{padding:14px 16px;color:var(--ink)}
.list details.more > summary .ico{width:30px;height:30px;border-radius:9px}
.list details.more > summary .ico svg{width:16px;height:16px}
.chips button .ico{width:32px;height:32px;border-radius:10px}
.chips button .ico svg{width:17px;height:17px}
.chips button[aria-pressed=true]{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent);background:var(--surface)}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px}
.switch .grow{min-width:0;flex:1}
.tog{width:50px;height:30px;border-radius:99px;border:0;background:var(--surface-3);position:relative;flex:none;transition:background .2s}
.tog::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.tog[aria-checked=true]{background:var(--accent)} .tog[aria-checked=true]::after{transform:translateX(20px)}
.btn{border:0;border-radius:14px;padding:13px 18px;font-weight:600;background:var(--accent);color:var(--accent-ink);font-size:15px}
.btn.ghost{background:var(--surface-2);color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:none;color:var(--bad);border:1px solid var(--line)}
.btn.danger.armed{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn.sm{padding:9px 14px;font-size:14px;border-radius:11px}
.btns{display:flex;gap:10px;flex-wrap:wrap} .btns .btn{flex:1 1 auto}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.swatches button{width:34px;height:34px;border-radius:50%;border:3px solid var(--surface);box-shadow:0 0 0 1px var(--line)}
.swatches button[aria-pressed=true]{box-shadow:0 0 0 2px var(--ink)}

.chart{width:100%;height:auto;display:block}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--muted);flex-wrap:wrap}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.sim-out{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.sim-out div{display:flex;flex-direction:column;gap:2px;min-width:0}
.sim-out b{font-family:var(--f-display);font-size:17px;font-weight:600;letter-spacing:-.02em}
.sim-out span{font-size:12px;color:var(--muted)}
.weeks{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.weeks button{aspect-ratio:1;max-width:100%;border-radius:10px;border:1px solid var(--line);background:var(--surface-2);font-size:12px;font-weight:600;color:var(--muted);padding:0;font-variant-numeric:tabular-nums}
.weeks button[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.tips{margin:0;padding:0;list-style:none}
.tips li{display:grid;grid-template-columns:28px 1fr;gap:10px;padding:13px 16px;font-size:14px;position:relative}
.tips li + li::before{content:"";position:absolute;top:0;left:54px;right:0;border-top:1px solid var(--line)}
.tips li > i{width:24px;height:24px;border-radius:7px;background:var(--accent-soft);color:var(--accent);font-weight:700;font-size:12.5px;display:grid;place-items:center;font-family:var(--f-display);font-style:normal}
.tips b{display:block;margin-bottom:2px}
textarea{font:inherit;font-size:16px;width:100%;min-height:110px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);padding:10px;resize:vertical}

nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;pointer-events:none;
  padding:0 max(14px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(14px, env(safe-area-inset-left, 0px))}
.tabs-in{pointer-events:auto;max-width:440px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);align-items:center;gap:2px;padding:6px;border-radius:24px;
  background:color-mix(in srgb, var(--surface) 88%, transparent);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4);box-shadow:0 10px 30px rgba(0,0,0,.14), 0 0 0 1px var(--line)}
.tabs button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 2px;font-size:10.5px;font-weight:600;color:var(--muted);border-radius:16px}
.tabs button svg{width:21px;height:21px}
.tabs button[aria-current=page]{color:var(--ink);background:var(--surface-2)}
.tabs .plus{justify-self:center;width:52px;height:52px;border-radius:17px;background:var(--accent);color:var(--accent-ink);padding:0;display:grid;place-items:center;box-shadow:0 6px 16px color-mix(in srgb, var(--accent) 40%, transparent)}
.tabs .plus svg{width:24px;height:24px}

.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40;opacity:0;transition:opacity .2s}
.scrim.open{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--surface);border-radius:26px 26px 0 0;max-height:92%;overflow:auto;transform:translateY(100%);transition:transform .26s cubic-bezier(.2,.8,.2,1);
  padding:10px max(18px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px))}
.sheet.open{transform:none}
.sheet-in{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:2px auto 4px}
.toast{position:fixed;left:50%;transform:translateX(-50%) translateY(20px);bottom:calc(96px + env(safe-area-inset-bottom, 0px));z-index:50;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:500;opacity:0;transition:.2s;pointer-events:none;max-width:calc(100% - 32px)}
.toast.show{opacity:1;transform:translateX(-50%)}
/* Coffres : pastille sous le titre, plus de débordement */
.vault-top .pill{align-self:flex-start;margin-top:4px}
.vault-top .grow h3{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Retour tactile */
.row,.env-row,.vault,.vault-mini,.chips button,.btn,.tabs button,.icon-btn,.seg button,.weeks button,.keys button,.month-nav button,.link{transition:transform .14s ease, background-color .2s, box-shadow .2s, color .2s}
.row:active,.env-row:active{background:var(--surface-2)}
.vault:active,.vault-mini:active,.btn:active,.icon-btn:active,.chips button:active,.weeks button:active,.month-nav button:active{transform:scale(.97)}
.tabs button:active{transform:scale(.92)}
.tabs .plus{transition:transform .2s cubic-bezier(.3,1.6,.5,1), box-shadow .2s}
.tabs .plus:active{transform:scale(.9) rotate(90deg)}
.tabs button[aria-current=page] svg{animation:pop .35s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(.8)}100%{transform:scale(1)}}

/* Entrée d'onglet : chaque bloc glisse en place, en partant d'un état déjà visible */
.enter > *{animation:rise .55s cubic-bezier(.2,.8,.2,1) both}
.enter > *:nth-child(2){animation-delay:.04s} .enter > *:nth-child(3){animation-delay:.08s} .enter > *:nth-child(4){animation-delay:.12s}
.enter > *:nth-child(5){animation-delay:.16s} .enter > *:nth-child(n+6){animation-delay:.2s}
@keyframes rise{from{transform:translateY(14px);opacity:.35}to{transform:none;opacity:1}}
.enter .bar i,.enter .track i,.enter .plan-bar i,.enter .tier-bar i{animation:grow .9s cubic-bezier(.2,.8,.2,1) both;transform-origin:left}
.enter .plan-bar i:nth-child(2){animation-delay:.12s} .enter .plan-bar i:nth-child(3){animation-delay:.24s}
@keyframes grow{from{transform:scaleX(0)}}
.enter .arc{animation:draw 1.1s cubic-bezier(.2,.8,.2,1) both}
@keyframes draw{from{stroke-dasharray:0 400}}
.flash{animation:flash .9s ease}
@keyframes flash{0%{box-shadow:0 0 0 0 color-mix(in srgb, var(--accent) 55%, transparent)}100%{box-shadow:0 0 0 14px transparent}}

/* Pavé numérique */
.amount{display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 0}
.amount .v{font-family:var(--f-display);font-size:44px;font-weight:600;letter-spacing:-.04em;line-height:1.1;font-variant-numeric:tabular-nums;min-height:50px}
.amount .v .cur{color:var(--muted);font-weight:500;font-size:28px;margin-left:4px}
.amount .v.zero{color:var(--muted)}
.amount .hint{font-size:12.5px;color:var(--muted);min-height:18px;text-align:center}
.amount.shake .v{animation:shake .35s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.amount .v.bump{animation:bump .18s ease}
@keyframes bump{50%{transform:scale(1.05)}}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.keys button{height:54px;border:0;border-radius:16px;background:var(--surface-2);font-family:var(--f-display);font-size:22px;font-weight:500;color:var(--ink);display:grid;place-items:center}
.keys button:active{transform:scale(.94);background:var(--surface-3)}
.keys button svg{width:22px;height:22px}
.more-opts{display:flex;flex-direction:column;gap:14px}

/* Confettis */
#confetti{position:fixed;inset:0;pointer-events:none;z-index:60;width:100%;height:100%}

/* Toast enrichi */
.toast{display:flex;align-items:center;gap:8px;border-radius:14px;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.toast.show{animation:toastIn .35s cubic-bezier(.3,1.5,.5,1)}
@keyframes toastIn{from{transform:translateX(-50%) translateY(16px) scale(.95)}}
.toast svg{width:16px;height:16px;flex:none;color:var(--accent)}

/* Gauge et anneaux */
.gauge .glow{filter:drop-shadow(0 0 6px color-mix(in srgb, var(--accent) 45%, transparent))}

/* ===== Style « appli bancaire » : surfaces neutres, un seul accent, typographie native ===== */
body{background:var(--bg)}
.app{gap:28px}
h1{font-size:31px;font-weight:700;letter-spacing:-.025em}
h2{font-size:20px;font-weight:700;letter-spacing:-.02em}
h3{font-size:16px;font-weight:600}
.top .hello span{font-size:13px;font-weight:500;text-transform:capitalize}
.label{font-size:13px;font-weight:500;text-transform:none;letter-spacing:0;color:var(--muted)}
.sec-head .link{font-size:15px;font-weight:500;padding:4px 0;background:none;color:var(--accent)}
.sync{font-size:12px}
.panel,.list,.stat:not(.flat),.vault,.vault-mini:not(.add),.example,.month-nav,.icon-btn{background:var(--surface);box-shadow:none;border:0}
.panel,.list,.vault,.stat{border-radius:var(--r)}
.icon-btn{border-radius:50%;width:40px;height:40px}
.icon-btn[aria-current=page]{background:var(--accent);color:#fff}
.stat.flat{background:var(--surface-2)}
.row{min-height:64px;padding:12px 16px}
.row + .row::before,.env-row + .env-row::before,.insight + .insight::before,.tips li + li::before{border-top:1px solid var(--line)}
.row + .row::before{left:68px}
.ico{width:40px;height:40px;border-radius:50%;background:var(--kc, var(--surface-2));color:#fff;box-shadow:none}
.ico:not([style]){background:var(--surface-2);color:var(--ink)}
.ico svg{width:19px;height:19px;stroke-width:2.1}
.insight .ico{width:32px;height:32px;border-radius:50%}
.chips .ico,.chips button .ico{width:34px;height:34px;border-radius:50%}
.amt{font-weight:600;letter-spacing:-.01em}
.pos{color:var(--good)} .neg{color:var(--bad)}
.bar{height:6px;background:var(--surface-2)}
.bar i{background:var(--gc, var(--accent));box-shadow:none}
.bar em{width:2px;background:var(--ink);opacity:.35}
.plan-bar{height:10px;gap:3px;background:transparent}
.plan-bar i{border-radius:99px}
.plan-rows .pr{padding:12px 0;font-size:15px}
.plan-rows .pr + .pr{border-top:1px solid var(--line)}
.plan-rows .pr.total span:last-child{font-size:22px;font-weight:700;letter-spacing:-.02em}
.btn{font-family:var(--f-body);font-weight:600;border-radius:14px;padding:15px 18px;font-size:16px}
.btn:not(.ghost):not(.danger){background:var(--accent);color:#fff;box-shadow:none}
.btn.ghost{background:var(--surface-2);border:0;color:var(--ink)}
.btn.sm{padding:11px 14px;font-size:15px}
.seg{background:var(--surface-2);border:0;border-radius:11px;padding:2px;gap:2px}
.seg button{border-radius:9px;font-weight:600;color:var(--ink);font-size:14px;padding:8px 4px}
.seg button[aria-pressed=true]{background:var(--seg-on);color:var(--ink);box-shadow:0 3px 8px rgba(0,0,0,.12), 0 0 0 .5px rgba(0,0,0,.04)}
.chips button{background:var(--surface-2);border:1.5px solid transparent;border-radius:16px;font-weight:600}
.chips button[aria-pressed=true]{background:var(--accent-soft);border-color:var(--accent);box-shadow:none}
.chips button.newchip{border:1.5px dashed var(--line);background:transparent;color:var(--accent)}
input,select{background:var(--surface-2);border:1.5px solid transparent;border-radius:12px;font-size:16px}
input:focus,select:focus{border-color:var(--accent);box-shadow:none;outline:none}
.keys{gap:6px}
.keys button{background:transparent;box-shadow:none;font-family:var(--f-body);font-size:28px;font-weight:400;height:56px;border-radius:50%}
.keys button:active{background:var(--surface-2)}
.amount .v{font-family:var(--f-body);font-size:52px;font-weight:700;letter-spacing:-.03em}
.amount .v .cur{font-size:30px;font-weight:600}
.pill{background:var(--surface-2);font-size:12px;font-weight:600}
.pill.good,.pill.warn,.pill.bad,.pill.info{background:color-mix(in srgb, currentColor 13%, transparent)}

/* Carte de solde : sombre, centrée, comme une carte bancaire */
.hero{background:linear-gradient(155deg,var(--hero-c) 0%,var(--hero-b) 45%,var(--hero-a) 100%);border-radius:24px;align-items:center;text-align:center;padding:26px 20px 18px;gap:10px;transform:none!important;box-shadow:0 18px 40px -22px rgba(0,0,0,.55), inset 0 1px 0 rgba(255,255,255,.08)}
.hero::before,.hero::after{display:none}
.hero-head{justify-content:center}
.hero .label{color:var(--hero-muted);font-size:14px}
.big{font-family:var(--f-body);font-size:50px;font-weight:700;letter-spacing:-.035em;line-height:1.05}
.big small{font-size:26px;font-weight:600;color:var(--hero-muted)}
.delta{justify-content:center}
.up-badge{background:rgba(255,255,255,.12);border-radius:99px;padding:4px 10px}
.hero .chart{margin-top:6px}
.spark-empty{text-align:center;border-top:1px solid var(--hero-line);width:100%;padding-top:12px}

/* Raccourcis ronds sous la carte */
.qa{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:-10px}
.qa button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:12.5px;font-weight:500;color:var(--ink);padding:2px 0}
.qa .c{width:54px;height:54px;border-radius:50%;background:var(--surface);display:grid;place-items:center;color:var(--accent);transition:transform .14s}
.qa .c svg{width:23px;height:23px;stroke-width:2.1}
.qa button:active .c{transform:scale(.92)}
.qa button.main .c{background:var(--accent);color:#fff}
/* Budget : une barre pleine longueur par ligne */
.plan-list{display:flex;flex-direction:column;gap:16px;padding-top:4px}
.pl-row{display:flex;flex-direction:column;gap:8px}
.pl-hd{display:flex;align-items:baseline;gap:8px;font-size:15px}
.pl-hd > span:first-child{font-weight:500}
.pl-pct{color:var(--muted);font-size:13px;margin-right:auto}
.pl-hd .amt{font-size:16px}
.pl-track{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.pl-track i{display:block;height:100%;border-radius:99px;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.enter .pl-track i{animation:grow .9s cubic-bezier(.2,.8,.2,1) both;transform-origin:left}
.enter .pl-row:nth-child(2) .pl-track i{animation-delay:.08s} .enter .pl-row:nth-child(3) .pl-track i{animation-delay:.16s} .enter .pl-row:nth-child(4) .pl-track i{animation-delay:.24s}
.pl-row.total{padding-top:14px;border-top:1px solid var(--line)}
.pl-row.total .pl-hd > span:first-child{font-weight:700;font-size:16px}
.pl-row.total .amt{font-size:22px;font-weight:700;letter-spacing:-.02em}
.pl-row.total .pl-track{height:10px}

/* Barre d'onglets : bouton + surélevé, indicateur actif */
.tabs-in{align-items:end;padding-top:8px;box-shadow:0 -1px 0 var(--line);background:color-mix(in srgb, var(--surface) 82%, transparent);backdrop-filter:blur(20px) saturate(1.6);-webkit-backdrop-filter:blur(20px) saturate(1.6)}
.tabs button{gap:4px;position:relative;font-size:11px;font-weight:500;padding:4px 2px 2px}
.tabs button svg{width:24px;height:24px}
.tabs button[aria-current=page]{color:var(--accent);font-weight:600}
.tabs button[aria-current=page] svg{stroke-width:2.4}
.tabs button[aria-current=page]::before{content:"";position:absolute;top:-8px;left:50%;width:24px;height:3px;border-radius:0 0 4px 4px;background:var(--accent);transform:translateX(-50%);animation:pop .3s ease}
.tabs .plus{align-self:end;justify-self:center;width:58px;height:58px;margin-top:-30px;margin-bottom:4px;transform:none;box-shadow:0 0 0 6px var(--bg), 0 12px 24px -8px color-mix(in srgb, var(--accent) 75%, transparent)}
.tabs .plus svg{width:27px;height:27px;stroke-width:2.4}
.tabs .plus:active{transform:scale(.92) rotate(90deg)}
.tabs .plus::before{display:none}

/* Mode discret */
.discret :is(.big,.amt,[data-n],.stat b,.vault .num,.vault-mini .amt,.vault-mini .num,.month .kv .small,.up-badge,.sim-out b,.chips small,.env-sub,.pl-pct,.d-big,.d-pct,.meta,.cmp td,.next .amt){filter:blur(8px);transition:filter .25s}
.discret .hero .big{cursor:pointer}
.big{cursor:pointer;-webkit-user-select:none;user-select:none}
#eyeBtn[aria-pressed=true]{background:var(--accent);color:#fff}

/* Glisser pour supprimer */
.row[data-edit-dep],.row[data-edit-mov],.row[data-edit-fixe]{touch-action:pan-y}
.row.swiping{background:var(--surface);z-index:1}
.row.swiping::after{content:"Supprimer";position:absolute;left:100%;top:0;bottom:0;width:100vw;background:var(--surface-3);color:var(--muted);display:flex;align-items:center;padding-left:20px;font-weight:600;font-size:14px;transition:background .15s,color .15s}
.row.swiping.armed::after{background:var(--bad);color:#fff}
.toast.has-undo{pointer-events:auto}
.toast .undo{background:none;border:0;color:var(--accent);font-weight:700;font-size:14px;margin-left:10px;padding:2px 0}
:root:not([data-theme="light"]) .toast .undo{filter:none}

/* Anneau des dépenses */
.donut-wrap{display:grid;grid-template-columns:150px 1fr;gap:16px;align-items:center}
.donut{width:150px;height:150px;overflow:visible}
.donut .slice{cursor:pointer;transition:stroke-width .25s, opacity .25s}
.donut .slice.dim{opacity:.3}
.donut .d-big{fill:var(--ink);font:700 22px var(--f-body);letter-spacing:-.02em}
.donut .d-sm{fill:var(--muted);font:500 10.5px var(--f-body)}
.d-legend{display:flex;flex-direction:column;gap:2px;min-width:0}
.d-item{display:grid;grid-template-columns:10px 1fr auto auto;gap:8px;align-items:center;background:none;border:0;padding:7px 8px;border-radius:10px;text-align:left;font-size:13.5px;color:var(--ink);transition:opacity .2s, background .2s}
.d-item.on{background:var(--surface-2)}
.d-item.dim{opacity:.4}
.d-dot{width:10px;height:10px;border-radius:50%}
.d-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.d-pct{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.d-item .amt{font-size:13.5px}
@media (max-width:400px){.donut-wrap{grid-template-columns:1fr;justify-items:center}.d-legend{width:100%}.donut{width:170px;height:170px}}

/* Bilan */
.bilan-cta{display:flex;align-items:center;gap:12px;width:100%;border:0;background:var(--surface);border-radius:var(--r);padding:14px 16px;text-align:left;color:var(--ink)}
.bilan-cta .grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.bilan-cta .chev{width:18px;height:18px;color:var(--muted);flex:none}
.bilan-cta.hot{background:var(--accent-soft)}
.bilan-cta:active{transform:scale(.98)}
.bilan-head{display:flex;gap:16px;align-items:center}
.bilan-head .grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.bilan-title{font-size:21px;font-weight:700;letter-spacing:-.02em;line-height:1.2}

.row .pill,.row .end{flex:none}
.b-st{flex:none;display:inline-flex;align-items:center;gap:4px;font-weight:700;font-size:14px;white-space:nowrap;padding-left:6px}
.b-st svg{width:16px;height:16px;stroke-width:2.6}
.list.inset .row{padding-right:14px}

/* Coffres : lignes d'info */
.vault-lines{display:flex;flex-direction:column;gap:6px}
.vline{display:flex;gap:8px;align-items:baseline}
.vdot{width:7px;height:7px;border-radius:50%;flex:none;transform:translateY(-1px)}

/* Nouveautés */
.hero-btn{margin-top:6px;display:inline-flex;align-items:center;gap:8px;border:0;border-radius:99px;padding:9px 14px;background:rgba(255,255,255,.12);color:var(--hero-ink);font-size:13.5px;font-weight:600}
.hero-btn svg{width:16px;height:16px}
.hero-btn:active{transform:scale(.96)}
.alert-line{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;padding:12px;border-radius:12px;background:color-mix(in srgb, var(--warn) 12%, transparent)}
.alert-line svg{width:18px;height:18px;color:var(--warn);flex:none;margin-top:1px}
.field .small.muted{font-size:12.5px}
.link svg{width:15px;height:15px;vertical-align:-2px;margin-right:2px}

const lastMonths = n => { const out=[], K=curKey(); for(let i=n-1;i>=0;i--) out.push(shiftKey(K,-i)); return out; };
function promoInfo(){
  if (!S.promo?.actif) return {actif:false};
  const fin = addDays(S.promo.debut, PROMO.jours);
  const reste = Math.ceil((new Date(fin+'T12:00') - new Date(today()+'T12:00'))/864e5);
  return {actif:reste>0, fin, reste:Math.max(0,reste), ecoule:Math.min(PROMO.jours, PROMO.jours-reste)};
}
function rateAt(x, f, promo){
  if (promo && x < PROMO.plafond) return PROMO.taux;
  for (const [lim, t] of FORMULES[f].paliers) if (x < lim) return t;
  return 0;
}
function grossYear(bal, f=S.formule, promo=promoInfo().actif){
  if (bal<=0) return 0;
  const cuts = new Set([0, bal]);
  FORMULES[f].paliers.forEach(([l])=>{ if(l<bal) cuts.add(l); });
  if (promo && PROMO.plafond<bal) cuts.add(PROMO.plafond);
  const pts = [...cuts].sort((a,b)=>a-b); let g = 0;
  for (let i=0;i<pts.length-1;i++) g += (pts[i+1]-pts[i]) * rateAt(pts[i], f, promo)/100;
  return g;
}
const netYear = (bal, f, p) => grossYear(bal, f, p)*(1-PFU);
const interetsAn = () => netYear(soldeRevolut()) + S.comptes.filter(c=>c.type==='reglemente'||c.type==='autre').reduce((s,c)=>s+Math.max(0,solde(c))*(c.taux||0)/100*(c.type==='reglemente'?1:(1-PFU)),0);

function eta(o){

  const m = Math.ceil(g.reste/g.rythme), k = shiftKey(curKey(), m), ok = (k+'-01') <= o.date;

function goalStatus(o){
  const done = epargneObj(o), reste = Math.max(0, o.cible-done);
  const mois = Math.max(0, monthsBetween(new Date(), new Date(o.date+'T12:00')));
  const parMois = reste<=0 ? 0 : (mois>0 ? reste/mois : reste);
  const p = o.cible>0 ? Math.min(1, Math.max(0,done)/o.cible) : 0;
  const ks = lastMonths(3);
  const rythme = S.mouvements.filter(m=>m.objId===o.id && ks.includes(monthKey(m.date))).reduce((s,m)=>s+m.montant,0)/3;

}

function monthProgress(k){
  const K = curKey(); if (k<K) return {elapsed:1, left:0, day:daysIn(k)};
  if (k>K) return {elapsed:0, left:daysIn(k), day:0};
  const day = new Date().getDate(), n = daysIn(k);
  return {elapsed:day/n, left:n-day+1, day};
}
function envStatus(e, k=curKey()){
  const s = spent(e.id, k), pl = e.plafond||0, mp = monthProgress(k), r = pl>0 ? s/pl : (s>0?1:0);

  if (pl<=0){ etat=''; txt='Sans plafond'; }

  else txt = mp.elapsed>=1 ? 'Tenu' : 'Dans le rythme';
  const reste = pl - s, parJour = mp.left>0 ? Math.max(0,reste)/mp.left : 0;

/* ---------- Épargne minimum du mois ---------- */
const minOn = () => !!(S.minimum && S.minimum.montant > 0);
let guardEnv = null;
/* Épargne du mois = salaire − prélèvements − achats prévus − enveloppes (plafond, ou plus si dépassé) − dépenses hors budget */
function epargneMois(extra=0, envId=null, ret=0){
  const K = curKey(), pl = plan(K); if (!(pl.R>0)) return null;
  let used = horsEnv(K) + (envId ? 0 : extra);
  S.enveloppes.forEach(e=>{ const sp = spent(e.id,K) + (e.id===envId ? extra : 0); used += e.plafond>0 ? Math.max(e.plafond, sp) : sp; });
  return pl.R - pl.F - pl.Pv - used - ret;
}
function guard(dep, ret, doit){
  const envId = guardEnv; guardEnv = null;
  if (!minOn() || (dep<=0 && ret<=0)) return doit();
  const avant = epargneMois(), apres = epargneMois(dep, envId, ret), m = S.minimum.montant;
  if (apres===null || apres >= m || apres >= avant) return doit();
  swap(()=>guardSheet(apres, ret>0, doit));
}

function tierViz(bal){

  if (maxCap >= 100000 && bal < 30000) scale = Math.max(bal*1.4, pi.actif?40000:3000);
  const bounds = [0, ...new Set([...caps].filter(c=>c<scale).sort((a,b)=>a-b)), scale];
  const segs = []; for (let i=0;i<bounds.length-1;i++) segs.push([bounds[i], bounds[i+1], rateAt(bounds[i], S.formule, pi.actif)]);

function slider(k,l,v,min,max,step,u){

function simulate(s){
  const n = Math.round(s.annees*12); let cap = s.initial, verse = s.initial; const pts=[[0,cap,verse]];
  for(let i=1;i<=n;i++){
    const net = s.mode==='revolut' ? netYear(cap,S.formule,false)/12 : cap*s.taux/100/12*(1-PFU);
    cap += net + s.mensuel; verse += s.mensuel; if(i%12===0) pts.push([i/12,cap,verse]);
  }
  return {cap, verse, pts};
}
function drawSim(){
  const res = simulate(S.sim);

  const W=340,H=170,L=46,B=22,T=8, pts=res.pts, mx=Math.max(1,...pts.map(p=>p[1])), lastY = pts[pts.length-1][0]||1;
  const X = y => L + y/lastY*(W-L-10), Y = v => T + (1-v/mx)*(H-T-B);
  const step = niceStep(mx/4), ticks=[]; for(let v=0; v<=mx; v+=step) ticks.push(v);
  const line = k => pts.map((p,i)=>(i?'L':'M')+X(p[0]).toFixed(1)+' '+Y(p[k]).toFixed(1)).join(' ');
  const every = Math.ceil(pts.length/6), lp = pts[pts.length-1];
  const yt = pts.filter((p,i)=> i%every===0 || i===pts.length-1).filter((p,i,a)=> i===a.length-1 || X(a[a.length-1][0])-X(p[0])>28);
  document.getElementById('simChart').innerHTML = `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Courbe du capital">
    ${ticks.map(v=>`<line x1="${L}" x2="${W-10}" y1="${Y(v)}" y2="${Y(v)}" style="stroke:var(--line);stroke-width:1"/><text x="${L-6}" y="${Y(v)+3.5}" text-anchor="end" style="fill:var(--muted);font-size:10px;font-family:var(--f-body)">${shortEur(v)}</text>`).join('')}
    <path d="${line(1)} L${X(lp[0])} ${Y(0)} L${X(0)} ${Y(0)}Z" style="fill:var(--accent);opacity:.12"/>
    <path d="${line(2)}" style="fill:none;stroke:var(--muted);stroke-width:1.6;stroke-dasharray:4 4;opacity:.7"/>
    <path d="${line(1)}" style="fill:none;stroke:var(--accent);stroke-width:2.4;stroke-linejoin:round"/>
    <circle cx="${X(lp[0])}" cy="${Y(lp[1])}" r="4" style="fill:var(--surface);stroke:var(--accent);stroke-width:2.2"/>
    ${yt.map(p=>`<text x="${X(p[0])}" y="${H-5}" text-anchor="${p[0]===0?'start':p===lp?'end':'middle'}" style="fill:var(--muted);font-size:10px;font-family:var(--f-body)">${p[0]===0?'auj.':p[0]+' an'+(p[0]>1?'s':'')}</text>`).join('')}
  </svg>`;
  drawInv();
}
function drawInv(){

const shortEur = v => v>=1e6? (v/1e6).toLocaleString('fr-FR',{maximumFractionDigits:1})+' M€' : v>=1000? Math.round(v/1000)+' k€' : Math.round(v)+' €';

function donutData(k){
  const by = {};
  S.depenses.filter(d=>monthKey(d.date)===k).forEach(d=>{ const id = d.fixeId ? '_fix' : d.prevu ? '_prev' : (d.envId||'_'); (by[id] ||= {s:0,n:0}); by[id].s += d.montant; by[id].n++; });
  return Object.entries(by).map(([id,v])=>{ const e = S.enveloppes.find(x=>x.id===id); return {id, nom:id==='_fix'?'Prélèvements':id==='_prev'?'Achats prévus':e?e.nom:'Hors enveloppe', cat:id==='_fix'?'logement':id==='_prev'?'tech':e?e.cat:'autre', s:v.s, n:v.n}; }).sort((a,b)=>b.s-a.s);
}
function donut(k){
  const data = donutData(k); if (!data.length) return '';
  if (sliceSel && !data.some(d=>d.id===sliceSel)) sliceSel = null;
  return `<section class="section"><h2>Où part mon argent</h2><div class="panel donut-wrap" id="donut">${donutInner(k)}</div></section>`;
}
function donutInner(k){
  const data = donutData(k), tot = data.reduce((t,d)=>t+d.s,0), R = 54, C = 2*Math.PI*R, gap = data.length>1 ? 2.5 : 0;
  const sel = data.find(d=>d.id===sliceSel); let off = 0;
  const arcs = data.map(d=>{ const len = d.s/tot*C, on = sel && sel.id===d.id;
    const a = `<circle class="arc slice ${sel&&!on?'dim':''}" data-slice="${d.id}" cx="80" cy="80" r="${R}" transform="rotate(-90 80 80)" style="fill:none;stroke:var(${cat(d.cat).k});stroke-width:${on?24:18}" stroke-dasharray="${Math.max(0.5,len-gap).toFixed(2)} ${C.toFixed(2)}" stroke-dashoffset="${(-off).toFixed(2)}"/>`;
    off += len; return a; }).join('');
  const centre = sel
    ? `<text x="80" y="70" text-anchor="middle" class="d-sm">${esc(sel.nom.length>16?sel.nom.slice(0,15)+'…':sel.nom)}</text><text x="80" y="93" text-anchor="middle" class="d-big">${fmt0(sel.s)}</text><text x="80" y="111" text-anchor="middle" class="d-sm">${Math.round(sel.s/tot*100)} % · ${sel.n} achat${sel.n>1?'s':''}</text>`
    : `<text x="80" y="76" text-anchor="middle" class="d-sm">Dépensé</text><text x="80" y="100" text-anchor="middle" class="d-big">${fmt0(tot)}</text>`;
  return `<svg class="donut" viewBox="0 0 160 160" role="img" aria-label="Répartition des dépenses">${arcs}${centre}</svg>
    <div class="d-legend">${data.map(d=>`<button class="d-item ${sel&&sel.id!==d.id?'dim':''} ${sel&&sel.id===d.id?'on':''}" data-slice="${d.id}"><span class="d-dot" style="background:var(${cat(d.cat).k})"></span><span class="d-name">${esc(d.nom)}</span><span class="d-pct">${Math.round(d.s/tot*100)} %</span><span class="amt">${fmt0(d.s)}</span></button>`).join('')}</div>`;
}

const RULES = [
  ['carburant', /total ?energies|esso|\bbp\b|shell|avia|station|carburant|dyneff|elan|agip/],
  ['courses', /lidl|leclerc|carrefour|auchan|intermarch|aldi|monoprix|super ?u|hyper ?u|franprix|casino|spar|grand frais|netto|biocoop|picard/],
  ['snack', /mcdo|mcdonald|burger king|kfc|quick|tacos|subway|kebab|five guys|uber ?eats|deliveroo|domino|pizza|boulang|starbucks|paul\b|grain de bl|sushi|chef |snack|crous/],
  ['sorties', /bar\b|pub\b|restaurant|resto|brasserie|cinema|cin[ée]ma|pathe|path[ée]|ugc|bowling|club|soir/],
  ['shopping', /zara|h&m|\bhm\b|nike|adidas|jd sports|primark|kiabi|celio|jules|bershka|pull ?& ?bear|shein|vinted|courir|snipes|foot locker/],
  ['sante', /pharma|doctolib|medecin|m[ée]decin|dentiste|opticien|laborato|t[ée]l[ée]consult|consultation|biotech/],
  ['soins', /coiff|barber|barbier|sephora|nocibe|marionnaud/],
  ['tech', /fnac|darty|boulanger|apple|steam|playstation|xbox|nintendo|instant gaming|ldlc|amazon/],
  ['transport', /sncf|ouigo|uber|bolt|heetch|tbm|ratp|blablacar|parking|indigo|p[ée]age|autoroute|vinci|sanef|aprr|norauto|feu vert|midas|speedy/],
  ['maison', /leroy|castorama|ikea|brico|action\b|gifi|maisons du monde|but\b|conforama/],
  ['loisirs', /fnac spectacle|ticketmaster|decathlon|intersport|parc|escape|laser ?game|karting/],
  ['cadeaux', /cadeau|nature et d[ée]couvertes|smartbox|wonderbox/]
];
function guessEnv(desc){
  const d = desc.toLowerCase(), learned = (S.regles||{})[merchantKey(desc)];
  if (learned !== undefined && (learned==='' || S.enveloppes.some(e=>e.id===learned))) return learned;
  for (const [c, re] of RULES) if (re.test(d)){ const e = S.enveloppes.find(x=>x.cat===c); if (e) return e.id; }
  return '';
}
const merchantKey = d => d.toLowerCase().replace(/[0-9*#]+/g,' ').replace(/\s+/g,' ').trim().slice(0,24);
function parseCSV(text){
  text = text.replace(/^﻿/,'');
  const first = text.split(/\r?\n/)[0] || '', sep = (first.match(/;/g)||[]).length > (first.match(/,/g)||[]).length ? ';' : ',';
  const rows = []; let row = [], cell = '', q = false;
  for (let i=0;i<text.length;i++){ const c = text[i];
    if (q){ if (c==='"'){ if (text[i+1]==='"'){ cell+='"'; i++; } else q = false; } else cell += c; }
    else if (c==='"') q = true; else if (c===sep){ row.push(cell); cell=''; }
    else if (c==='\n' || c==='\r'){ if (c==='\r' && text[i+1]==='\n') i++; row.push(cell); rows.push(row); row=[]; cell=''; }
    else cell += c; }
  if (cell || row.length){ row.push(cell); rows.push(row); }
  return rows.filter(r=>r.some(x=>x.trim()));
}
function toISO(v){
  v = (v||'').trim(); let m;
  if ((m = v.match(/^(\d{4})-(\d{2})-(\d{2})/))) return `${m[1]}-${m[2]}-${m[3]}`;
  if ((m = v.match(/^(\d{1,2})[\/.](\d{1,2})[\/.](\d{2,4})/))) return `${m[3].length===2?'20'+m[3]:m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;
  return null;
}
const MOIS = {janv:1,jan:1,'févr':2,fevr:2,'fév':2,fev:2,mars:3,mar:3,avr:4,mai:5,juin:6,juil:7,'août':8,aout:8,sept:9,sep:9,oct:10,nov:11,'déc':12,dec:12};
function frDate(s){ const m = s.trim().toLowerCase().match(/^(\d{1,2})\s+([a-zéû]+)\.?\s+(\d{4})$/); if (!m) return null; const mo = MOIS[m[2]]; if (!mo) return null; return `${m[3]}-${String(mo).padStart(2,'0')}-${m[1].padStart(2,'0')}`; }
function frNum(s){ const n = parseFloat(String(s).replace(/[€\s ]/g,'').replace(/\.(?=\d{3}(\D|$))/g,'').replace(',','.')); return isFinite(n) ? n : null; }
function parseStatementLines(pages){
  const out = []; let section = null, cols = null;
  pages.forEach(items=>{
    const lines = [];
    items.filter(i=>i.str.trim()).sort((a,b)=>b.y-a.y || a.x-b.x).forEach(it=>{
      let l = lines.find(l=>Math.abs(l.y-it.y)<3); if (!l){ l = {y:it.y, items:[]}; lines.push(l); } l.items.push(it); });
    lines.forEach(l=>{
      l.items.sort((a,b)=>a.x-b.x);
      const txt = l.items.map(i=>i.str).join(' ').replace(/\s+/g,' ').trim(), low = txt.toLowerCase();
      if (/^transactions du compte/.test(low)) { section = 'tx'; return; }
      if (/^en attente/.test(low)) { section = 'pending'; return; }
      if (/^(résumé|resume|rendements|coffres?|épargne|epargne|renvoy|annul|rembours|transactions annul)/.test(low)) { section = null; return; }
      if (/argent sortant/.test(low) && /description/.test(low)){
        const f = re => { const it = l.items.find(i=>re.test(i.str.toLowerCase())); return it ? it.x : null; };
        cols = {desc:f(/description/), out:f(/sortant/), inn:f(/entrant/), bal:f(/^solde/)}; return; }
      if (section!=='tx' || !cols) return;
      const left = l.items.filter(i=>i.x < cols.desc - 4).map(i=>i.str).join(' ').replace(/\s+/g,' ').trim();
      const date = frDate(left); if (!date) return;
      const desc = l.items.filter(i=>i.x >= cols.desc - 4 && i.x < cols.out - 20).map(i=>i.str).join(' ').replace(/\s+/g,' ').trim();
      const amtIn = (lo, hi) => { const it = l.items.find(i=>{ const cx = i.x + (i.w||0)/2; return cx >= lo && cx < hi && /\d/.test(i.str); }); return it ? frNum(it.str) : null; };
      const outA = amtIn(cols.out - 30, cols.inn ? cols.inn - 30 : 1e9), inA = cols.inn ? amtIn(cols.inn - 30, cols.bal ? cols.bal - 30 : 1e9) : null;
      if (desc) out.push({date, desc, sortant: outA, entrant: inA});
    });
  });
  return out;
}

let pdfReady = null;
function loadPdfJs(){
  if (window.pdfjsLib) return Promise.resolve(window.pdfjsLib);
  if (pdfReady) return pdfReady;
  pdfReady = new Promise((res, rej) => {
    const sc = document.createElement('script');
    sc.src = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js';
    sc.onload = () => { const L = window.pdfjsLib || window['pdfjs-dist/build/pdf']; if (!L) return rej(); L.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'; res(L); };
    sc.onerror = () => { pdfReady = null; rej(); };
    document.head.appendChild(sc);
  });
  return pdfReady;
}
async function readRevolutPdf(buf){
  const L = await loadPdfJs();
  const doc = await L.getDocument({data:new Uint8Array(buf)}).promise, pages = [];
  for (let i=1;i<=doc.numPages;i++){ const pg = await doc.getPage(i), tc = await pg.getTextContent(); pages.push(tc.items.map(it=>({str:it.str, x:it.transform[4], y:it.transform[5], w:it.width}))); }
  const tx = parseStatementLines(pages);
  if (!tx.length) return null;
  return tx.filter(t=>t.sortant>0).map(t=>({date:t.date, desc:t.desc, montant:t.sortant}));
}
const notSpending = d => /transfer|virement|^to |^vers |coffre|[ée]pargne|vault|digital assets|frais d'abonnement|^exchange|^change/i.test(d);
function readRevolut(text){
  const rows = parseCSV(text); if (rows.length<2) return null;
  const h = rows[0].map(x=>x.trim().toLowerCase());
  const col = (...names) => h.findIndex(x=>names.some(n=>x.includes(n)));
  const iDate = col('completed date','date de fin','started date','date de début','date'), iDesc = col('description','libell'), iAmt = col('amount','montant'), iOut = col('sortant','débit','debit'), iFee = col('fee','frais'), iState = col('state','état','etat','statut'), iType = col('type'), iProd = col('product','produit');
  if (iDate<0 || iDesc<0 || (iAmt<0 && iOut<0)) return null;
  const out = [];
  rows.slice(1).forEach(r=>{
    const raw = iAmt>=0 ? frNum(r[iAmt]) : (frNum(r[iOut]) ? -Math.abs(frNum(r[iOut])) : null);
    const amt = (raw||0) - (iFee>=0 ? Math.abs(frNum(r[iFee])||0) : 0), date = toISO(r[iDate]) || frDate(r[iDate]||''), desc = (r[iDesc]||'').trim();
    const state = iState>=0 ? (r[iState]||'').toLowerCase() : '', type = iType>=0 ? (r[iType]||'').toLowerCase() : '', prod = iProd>=0 ? (r[iProd]||'').toLowerCase() : '';
    if (!date || !(amt<0) || !desc) return;
    if (/revert|declin|refus|annul|pending|en attente/.test(state)) return;
    if (/exchange|change|transfer|virement|topup|recharge/.test(type) && !/card|carte/.test(type)) return;
    if (/savings|[ée]pargne|coffre|vault/.test(prod)) return;
    out.push({date, desc, montant:Math.round(-amt*100)/100});
  });
  return out;
}

/* ---------- Sauvegarde en fichier ---------- */
async function saveFile(){
  const data = JSON.stringify(S, null, 1), name = `socle-sauvegarde-${today()}.json`;
  try{
    const blob = new Blob([data], {type:'application/json'}), file = new File([blob], name, {type:'application/json'});
    if (navigator.canShare && navigator.canShare({files:[file]})) await navigator.share({files:[file]});
    else { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(a.href), 5000); }
    S.lastBackup = today(); commit('Sauvegarde enregistrée');
  }catch(e){
    if (e && e.name==='AbortError') return;
    openSheet('Ta sauvegarde','<p class="muted small">Le téléchargement n\'est pas disponible. Copie ce texte dans tes notes.</p><textarea id="exp" readonly></textarea>',null,null);
    const ta = document.getElementById('exp'); ta.value = JSON.stringify(S); ta.select(); S.lastBackup = today(); persist();
  }
}
function restoreFile(){

    <p class="small muted">Ou colle le texte d'une sauvegarde :</p><textarea id="imp"></textarea>`, () => {
      try{ applyBackup(JSON.parse(val('imp'))); }catch(_){ err("Ce texte n'est pas une sauvegarde valide."); }
    }, null, 'Restaurer');
  document.getElementById('bkFile').addEventListener('change', e => { const f = e.target.files[0]; if (!f) return; const rd = new FileReader(); rd.onload = () => { try{ applyBackup(JSON.parse(String(rd.result))); }catch(_){ err("Ce fichier n'est pas une sauvegarde valide."); } }; rd.readAsText(f); });
}
function applyBackup(x){

const SWIPE = {dep:['editDep','depenses','Dépense supprimée'], mov:['editMov','mouvements','Mouvement supprimé'], fixe:['editFixe','fixes','Prélèvement supprimé']};
let sw = null, swallow = false;
document.addEventListener('pointerdown', e => {
  const r = e.target.closest && e.target.closest('.row[data-edit-dep],.row[data-edit-mov],.row[data-edit-fixe]');
  if (!r || e.button>0) return;
  sw = {r, x:e.clientX, y:e.clientY, dx:0, lock:null};

document.addEventListener('pointermove', e => {
  if (!sw) return;
  const dx = e.clientX - sw.x, dy = e.clientY - sw.y;
  if (!sw.lock){ if (Math.abs(dx)<10 && Math.abs(dy)<10) return; sw.lock = Math.abs(dx) > Math.abs(dy)*1.3 ? 'x' : 'y'; if (sw.lock==='x') sw.r.classList.add('swiping'); }
  if (sw.lock!=='x') return;

  sw.r.classList.toggle('armed', sw.dx < -110);

const endSwipe = () => {
  if (!sw) return; const {r, dx, lock} = sw; sw = null;
  if (lock!=='x') return;

  if (dx < -110){
    const key = Object.keys(SWIPE).find(k=>r.dataset[SWIPE[k][0]]); const [attr, coll, msg] = SWIPE[key], id = r.dataset[attr];

  } else { r.style.transition = 'transform .25s cubic-bezier(.2,.8,.2,1)'; r.style.transform = ''; setTimeout(()=>{ r.style.transition=''; r.classList.remove('swiping','armed'); }, 260); }
};

const reduced = (()=>{ try{ return matchMedia('(prefers-reduced-motion: reduce)').matches; }catch(_){ return false; } })();
const buzz = (ms=8) => { try{ navigator.vibrate && navigator.vibrate(ms); }catch(_){} };
const shown = {};
const FMTS = {big:bigAmount, eur0:fmt0, eur:fmt};
function countUps(){
  document.querySelectorAll('[data-n]').forEach(el=>{
    const to = +el.dataset.n, k = el.dataset.k, f = FMTS[el.dataset.f] || fmt0;
    const from = shown[k] ?? 0; shown[k] = to;
    if (reduced || Math.abs(from-to) < 0.5) return;
    const t0 = performance.now(), dur = from===0 ? 1100 : 700;
    const step = now => { if (!el.isConnected) return; const p = Math.min(1,(now-t0)/dur), e = 1-Math.pow(1-p,4); el.innerHTML = f(from+(to-from)*e); if (p<1) requestAnimationFrame(step); else el.innerHTML = f(to); };
    requestAnimationFrame(step);
  });
}
function confetti(n=80, x, y){
  if (reduced) return;
  let c = document.getElementById('confetti');
  if (!c){ c = document.createElement('canvas'); c.id = 'confetti'; document.body.appendChild(c); }
  const dpr = window.devicePixelRatio||1, W = innerWidth, H = innerHeight;
  c.width = W*dpr; c.height = H*dpr; const ctx = c.getContext('2d'); ctx.scale(dpr,dpr);
  const cs = getComputedStyle(document.documentElement), cols = ['--accent','--k2','--k3','--k4','--k5','--k6'].map(v=>cs.getPropertyValue(v).trim()||'#4FD1A5');
  const ox = x ?? W/2, oy = y ?? H*0.38;
  const ps = Array.from({length:n}, () => { const a = Math.random()*Math.PI*2, sp = 4 + Math.random()*(n>60?9:5);
    return {x:ox, y:oy, vx:Math.cos(a)*sp, vy:Math.sin(a)*sp - (n>60?6:3), r:3+Math.random()*4, c:cols[Math.random()*cols.length|0], rot:Math.random()*6, vr:(Math.random()-.5)*.4, life:0, shape:Math.random()<.5}; });
  const t0 = performance.now();
  (function frame(now){
    const t = now - t0; ctx.clearRect(0,0,W,H);
    ps.forEach(p=>{ p.vy += .25; p.vx *= .985; p.x += p.vx; p.y += p.vy; p.rot += p.vr;
      ctx.save(); ctx.globalAlpha = Math.max(0, 1 - t/1800); ctx.translate(p.x,p.y); ctx.rotate(p.rot); ctx.fillStyle = p.c;
      if (p.shape) ctx.fillRect(-p.r, -p.r/2, p.r*2, p.r); else { ctx.beginPath(); ctx.arc(0,0,p.r*.7,0,Math.PI*2); ctx.fill(); } ctx.restore(); });
    if (t < 1800) requestAnimationFrame(frame); else ctx.clearRect(0,0,W,H);
  })(t0);
}

function tilt(e){
  const h = e.target.closest && e.target.closest('.hero'); if (!h || reduced) return;
  if (e.pointerType!=='mouse' && e.type==='pointermove' && tiltEl!==h) return;
  const r = h.getBoundingClientRect(), px = (e.clientX-r.left)/r.width, py = (e.clientY-r.top)/r.height;
  h.classList.add('tilting');
  h.style.setProperty('--ry', ((px-.5)*10).toFixed(2)+'deg'); h.style.setProperty('--rx', ((.5-py)*8).toFixed(2)+'deg');
  h.style.setProperty('--mx', (px*100).toFixed(1)+'%'); h.style.setProperty('--my', (py*100).toFixed(1)+'%');
}

  if (d.week){ const i=+d.week; S.defi[i]=!S.defi[i]; if (S.defi[i]){ buzz(12); const r=t.getBoundingClientRect(); confetti(S.defi.every(Boolean)?160:28, r.left+r.width/2, r.top+r.height/2); } return commit(S.defi[i]?(S.defi.every(Boolean)?'Défi 52 semaines terminé : 1 378 € !':`Semaine ${i+1} : +${i+1} €`):null); }
  switch(d.act){

    case 'new-goal': return goalSheet();

/* ---------- Automatisations ---------- */
function autoRun(){
  let changed = 0; const T = today(), K = curKey(), day = new Date().getDate();
  S.fixLog = S.fixLog || {};
  S.fixes.forEach(f=>{
    if ((f.freq||'mois')!=='mois') return;
    if (!f.since){ f.since = K; changed++; }
    for (let k = f.since; k <= K; k = shiftKey(k,1)){
      const tag = f.id+'|'+k; if (S.fixLog[tag]) continue;
      if (k===K && Math.min(f.jour, daysIn(k)) > day) continue;
      S.depenses.push({id:uid(), date:inMonth(k, f.jour), montant:f.montant, envId:null, fixeId:f.id, note:f.nom});
      S.fixLog[tag] = 1; changed++;
    }
  });
  const p = S.auto.programme, acc = (revolutEp()[0]||S.comptes[0]);
  if (p.actif && p.next && acc){
    let guard = 0;
    while (p.next <= T && guard++ < 400){
      const per = p.frequence==='jour' ? 7 : 0, amount = p.frequence==='jour' ? p.montant*7 : p.montant;
      S.mouvements.push({id:uid(), date:p.next, montant:amount, compteId:acc.id, objId:p.objId||null, note:'Épargne programmée', auto:true});
      p.next = p.frequence==='mois' ? inMonth(shiftKey(monthKey(p.next),1), p.jour||+p.next.slice(8)) : addDays(p.next, per||7);
      changed++;
    }
  }
  const a = S.auto.arrondis;
  if (a.actif && a.depuis && acc){
    for (let k = a.depuis; k < K; k = shiftKey(k,1)){
      if (a.fait && k <= a.fait) continue;
      S.mouvements.push({id:uid(), date:inMonth(shiftKey(k,1),1), montant:Math.round(a.achats*0.5*a.mult), compteId:acc.id, objId:null, note:'Arrondis de '+monthName(k,{month:'long'})+' (estimé)', auto:true});
      a.fait = k; changed++;
    }
  }
  if (changed && !S.example) persist();
  return changed;
}

/* iOS 26 (appli installée) : la zone d'affichage reste parfois trop courte au lancement, ce qui laisse
   une bande noire sous la barre. On force le navigateur à recalculer la hauteur. */
(function(){
  const els = () => [document.getElementById('scroll'), document.querySelector('nav.tabs')].filter(Boolean);
  function remeasure(){
    els().forEach(el=>{ const st = el.scrollTop; el.style.display='none'; void el.offsetHeight; el.style.display=''; el.scrollTop = st; });
  }
  [0,150,500,1200].forEach(t=>setTimeout(remeasure,t));
  addEventListener('resize', ()=>setTimeout(remeasure,140)); addEventListener('pageshow', remeasure);
  addEventListener('orientationchange', ()=>setTimeout(remeasure,300));
  document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) setTimeout(remeasure,100); });
  document.addEventListener('focusout', ()=>setTimeout(remeasure,140));
})();
if ('serviceWorker' in navigator){ let had = !!navigator.serviceWorker.controller; navigator.serviceWorker.addEventListener('controllerchange', ()=>{ if (had) location.reload(); had = true; }); navigator.serviceWorker.register('sw.js').catch(()=>{}); }
})();
